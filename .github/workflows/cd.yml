name: CD - Deploy to K3s Cluster
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH to K3s master
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_TAILSCALE_IP }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          script: |
            # Rollout restart pour puller les nouvelles images
            kubectl -n ims rollout restart deploy/backend
            kubectl -n ims rollout restart deploy/frontend
            # Attendre que les rollouts soient terminés
            kubectl -n ims rollout status deploy/backend --timeout=300s
            kubectl -n ims rollout status deploy/frontend --timeout=300s